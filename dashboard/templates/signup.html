<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · GenMove 1.0</title>
<link rel="stylesheet" href="/static/css/signup.css?v=20260825g"><link rel="stylesheet" href="/static/css/theme.css?v=20260825g"></head>
<body><main class="card"><h1>Create your GenMove 1.0 account</h1><p>Accounts are stored in native MySQL with hashed passwords.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><div class="field"><label>Full name</label><input name="display_name" required autofocus></div><div class="field"><label>Email address</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required></div><button type="submit">Create account</button></form><p class="foot">Already registered? <a href="/login">Sign in</a></p></main></body></html>
