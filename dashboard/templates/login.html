<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · GenMove 1.0</title>
<link rel="stylesheet" href="/static/css/login.css?v=20260825h"><link rel="stylesheet" href="/static/css/theme.css?v=20260825h"></head>
<body><main class="card"><div class="brand"><div class="mark">G</div><div><h1>GenMove 1.0</h1><p>Governed SAP migration validation</p></div></div>
{% if request.args.get('registered') %}<div class="success">Account created. You can now sign in.</div>{% endif %}{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post"><div class="field"><label>Email address</label><input type="email" name="email" autocomplete="email" required autofocus></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button type="submit">Sign in</button></form>
<p class="foot">New to GenMove? <a href="/signup">Create an account</a></p></main></body></html>
