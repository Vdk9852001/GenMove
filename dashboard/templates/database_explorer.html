<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GenMove Database Explorer</title>
  <link rel="stylesheet" href="/static/css/database_explorer.css?v=20260825h">
  <link rel="stylesheet" href="/static/css/theme.css?v=20260825h">
</head>
<body>
<header><h1>GenMove Database Explorer</h1><span>Read-only native MySQL viewer</span><a class="back" href="/">Back to Dashboard</a></header>
<main>
  <div class="toolbar">
    <label for="tableSelect"><b>Table</b></label>
    <select id="tableSelect"></select>
    <label for="pageSize">Rows</label>
    <select id="pageSize"><option>50</option><option selected>100</option><option>250</option><option>500</option></select>
    <input id="filter" placeholder="Filter current page..." aria-label="Filter current page">
    <button class="primary" onclick="loadTable(1)">Refresh</button>
    <a class="btn" id="exportBtn" href="#">Download CSV</a>
    <span id="summary"></span>
  </div>
  <div id="error" class="error"></div>
  <div class="sheet" id="sheet"><div class="loading">Connecting to MySQL...</div></div>
  <div class="footer"><button id="prev" onclick="loadTable(currentPage-1)">Previous</button><span id="pageText">Page 1</span><button id="next" onclick="loadTable(currentPage+1)">Next</button></div>
</main>
<script src="/static/js/database_explorer.js?v=20260825h" defer></script>
</body>
</html>
